name: C14 cloud WP1 offline verification
on:
  pull_request:
    paths:
      - 'legal_knowledge/audit_work/C14-CA01-STATUTORY/runner/hf_metadata_cloud.py'
      - 'legal_knowledge/audit_work/C14-CA01-STATUTORY/runner/hf_metadata_approval.py'
      - 'tests/test_legal_audit_c14_cloud_*.py'
      - '.github/workflows/c14-cloud-wp1.yml'
permissions:
  contents: read
jobs:
  synthetic:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'corpus/cloud-wp1-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'cryptography==50.0.2'
      - run: python -I -B -m unittest discover -s tests -p 'test_legal_audit_c14_cloud_*.py' -v
