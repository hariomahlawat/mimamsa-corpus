name: App contract and design checks

# Track B only. Path-filtered to app/**, the capability matrix CSV, the security test catalogue and this file.
# Precondition until the governance branch is integrated: origin/claude/c13-gov must exist on GitHub, because the
# contract tests read config/restricted_material.json from it and fail (never skip) without the register. It does not call, modify or depend on the HF sync
# workflows (sync-legal-knowledge-hf.yml, hf-sync-guard-ci.yml) and holds no secrets.
on:
  pull_request:
    paths:
      - "app/**"
      - "config/restricted_material.json"
      - "docs/architecture/CAPABILITY_TRACEABILITY_MATRIX.csv"
      - "docs/architecture/SECURITY_AND_DEPLOYMENT_ARCHITECTURE.md"
      - ".github/workflows/app-ci.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "app/**"
      - "config/restricted_material.json"
      - "docs/architecture/CAPABILITY_TRACEABILITY_MATRIX.csv"
      - "docs/architecture/SECURITY_AND_DEPLOYMENT_ARCHITECTURE.md"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full refs so that, before the governance branch is integrated, the tests can read
          # config/restricted_material.json from origin/claude/c13-gov. After integration the file is on the branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned contract dependencies
        run: python -m pip install --disable-pip-version-check -r app/contract/requirements.txt
      - name: Contract tests (network not needed; schemas resolve locally)
        working-directory: app/contract
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Validate committed examples with the CLI
        working-directory: app/contract
        run: |
          set -e
          REG_ARGS=""
          if [ ! -f ../../config/restricted_material.json ]; then
            git show origin/claude/c13-gov:config/restricted_material.json > "$RUNNER_TEMP/restricted_material.json"
            REG_ARGS="--register $RUNNER_TEMP/restricted_material.json"
          fi
          python -m mimamsa_contract $REG_ARGS record document examples/document.example.json
          python -m mimamsa_contract $REG_ARGS record derived_text examples/derived_text.example.json
          python -m mimamsa_contract $REG_ARGS record candidate examples/candidate_graph_edge.example.json
          python -m mimamsa_contract $REG_ARGS record candidate examples/candidate_outcome.example.json

  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned importer dependencies
        run: python -m pip install --disable-pip-version-check -r app/importer/requirements.txt
      - name: Importer source-fidelity tests (PR #54 DA-01/03/04/35 conditions)
        working-directory: app/importer
        run: python -m pytest -q -p no:cacheprovider tests

  kbuild:
    # C16 B02 central build skeleton: fixture builds only (offline mirror, development key generated in the test
    # temp directory, no HF, no secrets). Needs the .NET SDK for the S6 accelerator helper.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned importer dependencies
        run: python -m pip install --disable-pip-version-check -r app/importer/requirements.txt
      - name: Build pipeline tests (chaining, resume, determinism, refusals, degraded release)
        working-directory: app/kbuild
        run: python -m pytest -q -p no:cacheprovider tests --basetemp "$RUNNER_TEMP/kbuild"

  # C16 Tranche B CP-1: the integrated, explicitly DEGRADED vertical slice (B02 build -> B01 import -> B03 cloned-DB
  # migration and restricted loader -> B04 text-store adoption -> B06 journal activation with the flag ON in a real
  # Kestrel process -> serving, post-activation exclusion and rollback checks), then the PR #54 oracle in DEFAULT mode.
  # FIXTURE acceptance only: development keys, disposable c16cp1_* databases, no HF, no secrets.
  cp1-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mimamsa
          POSTGRES_PASSWORD: mimamsa
          POSTGRES_DB: mimamsa_b1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mimamsa" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PGPASSWORD: mimamsa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned importer dependencies
        run: python -m pip install --disable-pip-version-check -r app/importer/requirements.txt
      - name: Build (Release)
        run: dotnet build -c Release app/b1/Mimamsa.B1.slnx
      - name: SYN site and oracle database (default-mode oracle check)
        run: |
          python -I app/b1/build/build_fixture_site.py --out "$RUNNER_TEMP/syn"
          psql -h 127.0.0.1 -U mimamsa -d mimamsa_b1_test -c "CREATE DATABASE c16cp1_oracle"
      - name: CP-1 vertical slice (Linux)
        env:
          # the container's mimamsa user is a superuser: it also creates/drops the c16cp1_* databases and loader role
          MIMAMSA_TEST_DB: Host=127.0.0.1;Port=5432;Username=mimamsa;Password=mimamsa;Database=mimamsa_b1_test;Maximum Pool Size=10
        run: |
          python -I app/b1/build/c16_cp1_slice.py run --work "$RUNNER_TEMP/cp1" --configuration Release \
            --evidence out/cp1/slice-evidence-linux.json \
            --oracle-site "$RUNNER_TEMP/syn/site" --oracle-map "$RUNNER_TEMP/syn/fixture_map.json" \
            --oracle-db "Host=127.0.0.1;Port=5432;Username=mimamsa;Password=mimamsa;Database=c16cp1_oracle;Maximum Pool Size=10"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp1-slice-linux
          path: |
            out/cp1
            ${{ runner.temp }}/cp1/journey.log
            ${{ runner.temp }}/cp1/oracle.log
            ${{ runner.temp }}/cp1/slice-evidence.json

  design-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            app/design
            docs/architecture
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==9.2.0
      - name: Design checks (WCAG AA contrast, display scaling, keymap vs browser-reserved keys, client cache policy, capability matrix CSV)
        working-directory: app/design
        run: python -m pytest -q -p no:cacheprovider tests

  # ---------------- B1 vertical slice (ASP.NET Core service, offline UI, synthetic SYN site) ----------------
  # No corpus bytes in CI: the SYN site is rendered from the PR #54 development fixture (unmodified) and imported
  # through app/importer. The real-sample screenshots (sample.spec.cjs) run only where the corpus sample exists.
  b1:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mimamsa
          POSTGRES_PASSWORD: mimamsa
          POSTGRES_DB: mimamsa_b1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mimamsa" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PGPASSWORD: mimamsa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned importer dependencies
        run: python -m pip install --disable-pip-version-check -r app/importer/requirements.txt
      - name: Design tokens CSS is generated from app/design/tokens (no drift)
        run: python app/b1/web/gen_tokens.py --check
      - name: Create disposable databases
        run: |
          for db in mimamsa_b1_e2e_syn mimamsa_b1_oracle; do psql -h 127.0.0.1 -U mimamsa -d mimamsa_b1_test -c "CREATE DATABASE $db"; done
      - name: Build the synthetic SYN site (two releases, imported by app/importer)
        run: python -I app/b1/build/build_fixture_site.py --out "$RUNNER_TEMP/syn"
      - name: Vendor PDF.js 6.5.438 from the lockfile (offline asset at run time)
        working-directory: app/b1/web
        run: |
          npm ci --omit=optional --no-audit --no-fund
          node vendor.mjs
      - name: Build (Release)
        run: dotnet build -c Release app/b1/Mimamsa.B1.slnx
      - name: Unit and integration tests (real Kestrel process, PostgreSQL)
        env:
          MIMAMSA_TEST_SITE: ${{ runner.temp }}/syn/site
          MIMAMSA_TEST_MAP: ${{ runner.temp }}/syn/fixture_map.json
          MIMAMSA_TEST_DB: Host=127.0.0.1;Port=5432;Username=mimamsa;Password=mimamsa;Database=mimamsa_b1_test;Maximum Pool Size=40
        run: dotnet test -c Release --no-build app/b1/Mimamsa.B1.slnx --logger "trx;LogFileName=b1-tests.trx" --results-directory out/b1
      - name: PR #54 retrieval oracle (unmodified) against the real search service
        run: |
          python app/b1/tests/b1server.py --site "$RUNNER_TEMP/syn/site" --log out/b1/oracle-service.log \
            --db "Host=127.0.0.1;Port=5432;Username=mimamsa;Password=mimamsa;Database=mimamsa_b1_oracle;Maximum Pool Size=40" -- \
            python app/b1/tests/oracles/run_retrieval_oracle.py --map "$RUNNER_TEMP/syn/fixture_map.json" --out out/b1/oracle
      - name: Playwright journeys (headless Chromium, trace off)
        env:
          B1_SYN_SITE: ${{ runner.temp }}/syn/site
          B1_SYN_DB: Host=127.0.0.1;Port=5432;Username=mimamsa;Password=mimamsa;Database=mimamsa_b1_e2e_syn;Maximum Pool Size=40
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm install --no-save --silent playwright@1.63.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" test --config app/b1/e2e/playwright.config.cjs --trace off
      # C16 (PR #80 review, acceptance evidence): the same C# suite, unmodified oracle and journeys again with the
      # persistent disk text store (ADR-0008) and disk search engine (ADR-0007). Defaults stay memory/memory.
      - name: Disk configuration - unit and integration tests (disk text store + disk search engine)
        env:
          MIMAMSA_TEST_SITE: ${{ runner.temp }}/syn/site
          MIMAMSA_TEST_MAP: ${{ runner.temp }}/syn/fixture_map.json
          MIMAMSA_TEST_DB: Host=127.0.0.1;Port=5432;Username=mimamsa;Password=mimamsa;Database=mimamsa_b1_test;Maximum Pool Size=40
          MIMAMSA_TEST_TEXT_STORE: disk
          Mimamsa__Text__Store: disk
          Mimamsa__Text__Dir: ${{ runner.temp }}/disk/text
          Mimamsa__Search__Engine: disk
          Mimamsa__Search__IndexDir: ${{ runner.temp }}/disk/index
        run: dotnet test -c Release --no-build app/b1/Mimamsa.B1.slnx --logger "trx;LogFileName=b1-tests-disk.trx" --results-directory out/b1-disk
      - name: Disk configuration - retrieval oracle (unmodified)
        env:
          Mimamsa__Text__Store: disk
          Mimamsa__Text__Dir: ${{ runner.temp }}/disk/text
          Mimamsa__Search__Engine: disk
          Mimamsa__Search__IndexDir: ${{ runner.temp }}/disk/index
        run: |
          python app/b1/tests/b1server.py --site "$RUNNER_TEMP/syn/site" --log out/b1-disk/oracle-service.log             --db "Host=127.0.0.1;Port=5432;Username=mimamsa;Password=mimamsa;Database=mimamsa_b1_oracle;Maximum Pool Size=40" --             python app/b1/tests/oracles/run_retrieval_oracle.py --map "$RUNNER_TEMP/syn/fixture_map.json" --out out/b1-disk/oracle
      - name: Disk configuration - Playwright journeys
        env:
          B1_SYN_SITE: ${{ runner.temp }}/syn/site
          B1_SYN_DB: Host=127.0.0.1;Port=5432;Username=mimamsa;Password=mimamsa;Database=mimamsa_b1_e2e_syn;Maximum Pool Size=40
          Mimamsa__Text__Store: disk
          Mimamsa__Text__Dir: ${{ runner.temp }}/disk/text
          Mimamsa__Search__Engine: disk
          Mimamsa__Search__IndexDir: ${{ runner.temp }}/disk/index
        run: |
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" test --config app/b1/e2e/playwright.config.cjs --trace off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-linux-results
          path: |
            out/b1
            out/b1-disk
            app/b1/e2e/out
